<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<header class="bg-pink-500 text-white p-4">
  <h1 class="text-xl font-bold">Admin Panel</h1>
</header>

<div class="flex min-h-screen">

<aside class="w-64 bg-gray-800 text-white p-5">
  <h2 class="text-lg font-bold mb-6">Navigation</h2>

  <nav class="space-y-3">
    <a href="dashboard.html" class="block text-blue-300">Dashboard</a>
    <a href="products.html" class="block hover:text-blue-300">Products</a>
    <a href="index.html" class="block text-red-300">Logout</a>
  </nav>
</aside>

<main class="flex-1 p-8">
  <h2 class="text-3xl font-bold mb-6">Dashboard</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

    <div class="bg-white p-6 rounded-xl shadow">
      <p class="text-gray-500">Total Penjualan</p>
      <h3 class="text-2xl font-bold">Rp25.000.000</h3>
    </div>

    <div class="bg-white p-6 rounded-xl shadow">
      <p class="text-gray-500">Total Produk</p>
      <h3 class="text-2xl font-bold">150</h3>
    </div>

    <div class="bg-white p-6 rounded-xl shadow">
      <p class="text-gray-500">Total Customer</p>
      <h3 class="text-2xl font-bold">320</h3>
    </div>

    <div class="bg-white p-6 rounded-xl shadow">
      <p class="text-gray-500">Pesanan</p>
      <h3 class="text-2xl font-bold">85</h3>
    </div>

  </div>
</main>

</div>

<footer class="bg-gray-800 text-white text-center p-4">
  &copy; 2026 Admin Panel
</footer>

</body>
</html>
