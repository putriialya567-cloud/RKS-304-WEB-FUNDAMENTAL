<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Produk</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<header class="bg-pink-500 text-white p-4">
  <h1 class="text-xl font-bold">Admin Panel</h1>
</header>

<div class="flex min-h-screen">

<aside class="w-64 bg-gray-800 text-white p-5">
  <h2 class="text-lg font-bold mb-6">Navigation</h2>
  <nav class="space-y-3">
    <a href="dashboard.html" class="block hover:text-blue-300">Dashboard</a>
    <a href="products.html" class="block text-blue-300">Products</a>
    <a href="index.html" class="block text-red-300">Logout</a>
  </nav>
</aside>

<main class="flex-1 p-8">

  <div class="flex justify-between items-center mb-6">
    <h2 class="text-3xl font-bold">Manajemen Produk</h2>

    <a href="add-produk.html"
       class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
      + Add Product
    </a>
  </div>

  <div class="bg-white rounded-xl shadow overflow-hidden">
    <table class="w-full">
      <thead class="bg-gray-200">
        <tr>
          <th class="p-3 text-left">No</th>
          <th class="p-3 text-left">Name</th>
          <th class="p-3 text-left">Stock</th>
          <th class="p-3 text-left">Action</th>
        </tr>
      </thead>

      <tbody>
        <tr class="border-b">
          <td class="p-3">1</td>
          <td class="p-3">Laptop ASUS</td>
          <td class="p-3">20</td>
          <td class="p-3">
            <a href="edit-produk.html"
               class="bg-yellow-500 text-white px-3 py-1 rounded">
              Edit
            </a>
            <button class="bg-red-600 text-white px-3 py-1 rounded">
              Delete
            </button>
          </td>
        </tr>

        <tr class="border-b">
          <td class="p-3">2</td>
          <td class="p-3">Mouse Wireless</td>
          <td class="p-3">35</td>
          <td class="p-3">
            <a href="edit-produk.html"
               class="bg-yellow-500 text-white px-3 py-1 rounded">
              Edit
            </a>
            <button class="bg-red-600 text-white px-3 py-1 rounded">
              Delete
            </button>
          </td>
        </tr>

        <tr>
          <td class="p-3">3</td>
          <td class="p-3">Keyboard Mechanical</td>
          <td class="p-3">15</td>
          <td class="p-3">
            <a href="edit-produk.html"
               class="bg-yellow-500 text-white px-3 py-1 rounded">
              Edit
            </a>
            <button class="bg-red-600 text-white px-3 py-1 rounded">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</main>
</div>

<footer class="bg-gray-800 text-white text-center p-4">
  &copy; 2026 Admin Panel
</footer>

</body>
</html>
