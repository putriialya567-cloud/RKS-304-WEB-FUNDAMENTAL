<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Validasi Input</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-100 min-h-screen flex items-center justify-center py-10">

    <div class="bg-white w-full max-w-lg p-8 rounded-2xl shadow-lg">

        <h1 class="text-3xl font-bold text-center text-pink-600 mb-2">
            Form Registrasi
        </h1>

        <p class="text-center text-gray-500 mb-6">
            Silakan isi data diri Anda
        </p>

        <form id="registerForm" action="dashboard.html">

            <!-- Username -->
            <div class="mb-4">
                <label for="username"
                    class="block text-gray-700 font-semibold mb-2">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Masukkan username"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-pink-400"
                >

                <p id="usernameError" class="text-red-500 text-sm mt-1"></p>
            </div>


            <!-- Password -->
            <div class="mb-4">
                <label for="password"
                    class="block text-gray-700 font-semibold mb-2">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Masukkan password"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-pink-400"
                >

                <p id="passwordError" class="text-red-500 text-sm mt-1"></p>
            </div>


            <!-- Nama -->
            <div class="mb-4">
                <label for="nama"
                    class="block text-gray-700 font-semibold mb-2">
                    Nama Lengkap
                </label>

                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama lengkap"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-pink-400"
                >

                <p id="namaError" class="text-red-500 text-sm mt-1"></p>
            </div>


            <!-- Tanggal Lahir -->
            <div class="mb-4">
                <label for="tanggalLahir"
                    class="block text-gray-700 font-semibold mb-2">
                    Tanggal Lahir
                </label>

                <input
                    type="date"
                    id="tanggalLahir"
                    name="tanggalLahir"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-pink-400"
                >

                <p id="tanggalLahirError"
                    class="text-red-500 text-sm mt-1">
                </p>
            </div>


            <!-- Alamat -->
            <div class="mb-4">
                <label for="alamat"
                    class="block text-gray-700 font-semibold mb-2">
                    Alamat
                </label>

                <textarea
                    id="alamat"
                    name="alamat"
                    rows="3"
                    placeholder="Masukkan alamat"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-pink-400"
                ></textarea>

                <p id="alamatError" class="text-red-500 text-sm mt-1"></p>
            </div>


            <!-- Nomor Telepon -->
            <div class="mb-6">
                <label for="telepon"
                    class="block text-gray-700 font-semibold mb-2">
                    Nomor Telepon
                </label>

                <input
                    type="text"
                    id="telepon"
                    name="telepon"
                    placeholder="Contoh: 628123456789"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-pink-400"
                >

                <p id="teleponError" class="text-red-500 text-sm mt-1"></p>
            </div>


            <!-- Button -->
            <button
                type="submit"
                class="w-full bg-pink-500 hover:bg-pink-600
                text-white font-bold py-3 rounded-lg transition">
                Daftar
            </button>

        </form>

    </div>


    <!-- JavaScript -->
    <script src="input.js"></script>

</body>
</html>
